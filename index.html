<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recapy – AI Movie Recap Studio</title>
<style>
:root{--red:#E52246;--dark:#C9183A;--bg:#FFF8FA;--text:#211B20;--sub:#7A7077;--line:#EADDE1}
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Myanmar","Myanmar Text",Arial,sans-serif}
body{background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.mark{width:28px;height:28px;border-radius:8px;background:var(--red);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center}
.right{display:flex;align-items:center;gap:8px;position:relative}
select{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--text)}
.avatar{width:32px;height:32px;border-radius:50%;border:0;background:var(--red);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.menu{display:none;position:absolute;top:42px;right:0;min-width:210px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.menu.open{display:block}
.menu .em{font-size:12.5px;color:var(--sub);padding:2px 4px 10px;word-break:break-all}
.menu button{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:600;color:var(--dark);cursor:pointer}
.menu button:hover{border-color:var(--red)}
main{max-width:900px;margin:auto;padding:16px}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
h2{font-size:18px}
.new{padding:8px 14px;border:0;border-radius:10px;background:var(--red);color:#fff;font-size:13.5px;font-weight:600;cursor:pointer}
.new:hover{background:var(--dark)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;color:var(--text)}
.card:hover{border-color:var(--red)}
.card b{display:block;font-size:14px;font-weight:600}
.card small{display:block;margin-top:3px;font-size:12px;color:var(--sub);line-height:1.4}
button:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
body.hide{visibility:hidden}
</style>
</head>
<body class="hide">
<header>
  <div class="logo"><div class="mark">R</div>Recapy</div>
  <div class="right">
    <select id="lang" aria-label="Language"><option value="my">မြန်မာ</option><option value="en">English</option></select>
    <button class="avatar" id="av" type="button" aria-label="Account"></button>
    <div class="menu" id="menu">
      <div class="em" id="em"></div>
      <button id="out" type="button"></button>
    </div>
  </div>
</header>
<main>
  <div class="bar"><h2 id="h"></h2><button class="new" id="new" type="button"></button></div>
  <div class="grid" id="grid"></div>
</main>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb = supabase.createClient(
  'https://mqfrbyhgchwlalssvryg.supabase.co',
  'sb_publishable_HI15OArsWOwB9P_7Go25HA_CYtjtiyH'
);
const CARDS = [
  ['Upload Movie','ရုပ်ရှင် တင်ရန်','Video ထည့်ပါ','Add a video'],
  ['Recap Settings','Recap ရွေးချယ်မှု','ဘာသာ၊ Ratio၊ Resolution','Language, ratio, quality'],
  ['AI Script','AI Script','Recap စာ ရေးပေးမည်','Write the recap'],
  ['Voiceover','Voiceover','အသံ ဖန်တီးမည်','Generate the voice'],
  ['Subtitle','Subtitle','စာတန်း ထည့်မည်','Add captions'],
  ['Scene Editor','Scene တည်းဖြတ်','ဇာတ်ဝင်ခန်း စီမည်','Arrange scenes'],
  ['Logo','Logo','ကိုယ်ပိုင် Logo','Your own logo'],
  ['Video Export','Video Export','MP4 ထုတ်ယူမည်','Download MP4'],
  ['History','Project မှတ်တမ်း','အရင်လုပ်ထားသည်များ','Past projects'],
  ['Account','အကောင့်','အကောင့်အချက်အလက်','Your account']
];
const T = {
  my:{h:'Dashboard',n:'+ Project အသစ်',o:'Logout',soon:'ဒီအပိုင်းကို မကြာမီ ထည့်သွင်းပါမည်'},
  en:{h:'Dashboard',n:'+ New project',o:'Log out',soon:'This feature is coming soon'}
};
let lang = 'my', email = '';
try { lang = localStorage.getItem('lang') || 'my'; } catch(e){}
const $ = id => document.getElementById(id);
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('show'),1800); }
function render(){
  $('lang').value = lang;
  $('h').textContent = T[lang].h;
  $('new').textContent = T[lang].n;
  $('out').textContent = T[lang].o;
  $('grid').innerHTML = '';
  CARDS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'card'; b.type = 'button';
    const t = document.createElement('b'); t.textContent = lang === 'my' ? c[1] : c[0];
    const s = document.createElement('small'); s.textContent = lang === 'my' ? c[2] : c[3];
    b.append(t, s);
    b.onclick = () => toast(T[lang].soon);
    $('grid').appendChild(b);
  });
  document.documentElement.lang = lang === 'my' ? 'my' : 'en';
}
$('lang').onchange = e => { lang = e.target.value; try{localStorage.setItem('lang',lang)}catch(x){} render(); };
$('new').onclick = () => toast(T[lang].soon);
$('av').onclick = e => { e.stopPropagation(); $('menu').classList.toggle('open'); };
document.addEventListener('click', e => { if (!$('menu').contains(e.target)) $('menu').classList.remove('open'); });
$('out').onclick = async () => { await sb.auth.signOut(); location.replace('login.html'); };
sb.auth.getSession().then(({data}) => {
  const u = data.session && data.session.user;
  if (!u) { location.replace('login.html'); return; }
  email = u.email || '';
  $('em').textContent = email;
  $('av').textContent = (email[0] || 'R').toUpperCase();
  render();
  document.body.classList.remove('hide');
});
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') location.replace('login.html'); });
</script>
</body>
</html>
