<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recapy – Login</title>
<style>
:root{--red:#E52246;--dark:#C9183A;--bg:#FFF8FA;--text:#211B20;--sub:#7A7077;--line:#EADDE1}
*{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Myanmar","Myanmar Text",Arial,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 22px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.05)}
.mark{width:52px;height:52px;margin:0 auto 12px;border-radius:14px;background:var(--red);color:#fff;font-size:26px;font-weight:700;display:flex;align-items:center;justify-content:center}
h1{font-size:22px}
p{margin-top:6px;font-size:13.5px;color:var(--sub);line-height:1.5}
.g{margin-top:22px;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:600;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.g:hover{border-color:var(--red)}
.g:disabled{opacity:.6;cursor:wait}
.g svg{width:18px;height:18px}
#err{margin-top:12px;font-size:13px;color:var(--dark);min-height:18px}
select{margin-top:18px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--text)}
button:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
</style>
</head>
<body>
<div class="box">
  <div class="mark">R</div>
  <h1>Recapy</h1>
  <p id="sub"></p>
  <button class="g" id="go" type="button">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.5l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
    <span id="btn"></span>
  </button>
  <div id="err" role="alert"></div>
  <select id="lang" aria-label="Language"><option value="my">မြန်မာ</option><option value="en">English</option></select>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb = supabase.createClient(
  'https://mqfrbyhgchwlalssvryg.supabase.co',
  'sb_publishable_HI15OArsWOwB9P_7Go25HA_CYtjtiyH'
);
const T = {
  my:{s:'AI Movie Recap Studio ကို အသုံးပြုရန် Google ဖြင့် ဝင်ရောက်ပါ',b:'Google ဖြင့် ဝင်ရောက်ရန်',e:'ဝင်ရောက်၍ မရပါ။ ထပ်စမ်းကြည့်ပါ။'},
  en:{s:'Sign in with Google to use AI Movie Recap Studio',b:'Login with Google',e:'Login failed. Please try again.'}
};
let lang = 'my';
try { lang = localStorage.getItem('lang') || 'my'; } catch(e){}
const $ = id => document.getElementById(id);
function render(){
  $('lang').value = lang;
  $('sub').textContent = T[lang].s;
  $('btn').textContent = T[lang].b;
  document.documentElement.lang = lang;
}
$('lang').onchange = e => { lang = e.target.value; try{localStorage.setItem('lang',lang)}catch(x){} render(); };
$('go').onclick = async () => {
  $('go').disabled = true; $('err').textContent = '';
  const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
  
   options: { redirectTo: location.origin + '/recapy/' }
  });
  if (error) { $('err').textContent = T[lang].e; $('go').disabled = false; }
};
sb.auth.getSession().then(({data}) => {
  if (data.session) location.replace('index.html');
});
render();
</script>
</body>
</html>
